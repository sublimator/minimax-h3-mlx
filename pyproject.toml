[project]
name = "h3mlx"
version = "0.0.1"
description = "MiniMax H3 in MLX, op by op, tested against diffusers 0.42.1"
license = "Apache-2.0"
requires-python = ">=3.11,<3.14"
# torch (CPU): the seeded noise and torchaudio's resampler; transformers + torchvision: the Qwen3-VL tokenizer and
# processor; pillow: image references. The models themselves run in MLX.
dependencies = ["mlx>=0.32.4", "numpy>=2", "mlx-vlm==0.7.11", "torch>=2.8", "torchvision", "transformers>=5.14", "pillow"]

[dependency-groups]
dev = ["pytest>=8", "diffusers==0.42.1", "peft"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/h3mlx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
