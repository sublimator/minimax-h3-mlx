[project]
name = "h3mlx"
version = "0.0.1"
description = "MiniMax H3 and P-H3-Image in MLX, op by op, tested against diffusers"
license = "Apache-2.0"
requires-python = ">=3.11,<3.14"
# torch (CPU): the seeded noise and torchaudio's resampler; transformers + torchvision: the Qwen3-VL tokenizer and
# processor; pillow: image references. The models themselves run in MLX.
dependencies = ["mlx>=0.32.4", "numpy>=2", "mlx-vlm==0.7.11", "torch>=2.8", "torchvision", "transformers>=5.14", "pillow"]

[dependency-groups]
# diffusers main pinned: P-H3-Image (PH3Image*) is not in a release yet; the H3 code there is 0.42.1 plus a tensor-parallel plan
# and a scale_noise precision note (checked: the H3 tests pass against both).
dev = ["pytest>=8", "diffusers @ git+https://github.com/huggingface/diffusers@d3d8af89e5b08a352cf47bba3a451c5fed9a49b1", "peft"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/h3mlx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
